# --- Terminal e cores ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on

# Teclas estendidas (CSI u): repassa combinações como Shift+Enter e Ctrl+Shift+letra
# aos programas (Claude Code, Neovim). O Ghostty já manda nesse formato.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Deixa programas falarem direto com o Ghostty (imagens no yazi, notificações, títulos)
set -g allow-passthrough on

# --- Prefixo: Ctrl+a ---
unbind C-b
set -g prefix C-a
bind a send-prefix            # Ctrl+a a: manda Ctrl+a ao programa
bind C-a last-window          # Ctrl+a Ctrl+a: última janela

# --- Numeração a partir de 1 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Divisões e janelas na pasta atual ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Redimensionar (Ctrl+a e H/J/K/L; segure para repetir) ---
# Ctrl+a l continua sendo o padrão do tmux: última janela
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Limpar a tela (Ctrl+l virou navegação) ---
bind C-l send-keys 'C-l'

# --- Popups ---
# Ctrl+a g: lazygit flutuando, na pasta do pane atual (fecha ao sair do lazygit)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Ctrl+a ?: lista de atalhos com busca (substitui a lista padrão do tmux)
bind ? display-popup -E -w 80% -h 80% "tmux list-keys | fzf --no-sort --prompt='atalhos > '"

# --- Recarregar ---
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"

# --- Modo de cópia estilo Vim, copiando para o Wayland ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# --- Tema Catppuccin: opções antes de carregar o tema ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Abas mostram o nome da janela (#W), não o título do terminal (#T, que era "arch")
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Ícones de estado nas abas: só os que avisam algo (zoom, sino, atividade);
# os de "atual" e "última" ficam vazios porque a cor da aba já diz isso
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_last ""
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Nome automático da janela: no shell mostra a pasta; rodando algo, o programa
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

set -g status-position top
# O tmux 3.8 sublinha a janela atual por padrão (underscore) e o tema não desfaz isso:
# sobrava uma linha fina rosa ao lado do separador arredondado da janela atual
set -g window-status-current-style default
set -g status-interval 5

# Esquerda: sessão (verde; fica vermelha enquanto o prefixo Ctrl+a está ativo)
set -g status-left-length 50
set -g status-left "#{E:@catppuccin_status_session} "
# Direita: pasta do pane atual. Relógio/CPU/RAM ficam na barra do Noctalia.
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"

# --- TPM: sempre a última linha ---
run '~/.tmux/plugins/tpm/tpm'
