# ~/.tmux.conf
# Ordem: 1) terminal  2) comportamento  3) atalhos  4) tema (PowerKit)  5) plugins
# Recarregar: Ctrl+a r

# ============================================================================
# 1. Terminal
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"      # cores de 24 bits no Ghostty
set -g focus-events on                              # Neovim sabe quando o pane ganha foco
set -sg escape-time 10                              # Esc responde rápido no Neovim

# Teclas estendidas (CSI u): Shift+Enter, Ctrl+Shift+letra etc. chegam aos
# programas (Claude Code, Neovim) em vez de virarem Enter/letra comuns
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Programas falam direto com o Ghostty (imagens do yazi, notificações do Claude Code)
set -g allow-passthrough on

# ============================================================================
# 2. Comportamento
# ============================================================================
set -g history-limit 50000
set -g mouse on

# Janelas e panes numerados a partir de 1 (casa com a fileira de números do teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                          # fechar a 2 faz a 3 virar 2

# Nome da janela: no shell mostra a pasta; rodando algo, o programa (nvim, k9s...)
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Modo de cópia com teclas do Vim, copiando para a área de transferência do Wayland
setw -g mode-keys vi

# ============================================================================
# 3. Atalhos (prefixo Ctrl+a)
# ============================================================================
unbind C-b
set -g prefix C-a
bind a send-prefix                                  # Ctrl+a a: manda Ctrl+a ao programa
bind C-a last-window                                # Ctrl+a Ctrl+a: última janela

# Divisões e janelas novas abrem na pasta atual
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Redimensionar com H/J/K/L (segure para repetir). Navegar entre panes é
# Ctrl+h/j/k/l, sem prefixo, pelo vim-tmux-navigator (funciona dentro do Neovim)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+l virou navegação; Ctrl+a Ctrl+l limpa a tela
bind C-l send-keys 'C-l'

# Popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit   # Ctrl+a g: lazygit
bind ? display-popup -E -w 80% -h 80% "tmux list-keys | fzf --no-sort --prompt='atalhos > '"  # Ctrl+a ?: atalhos

# Copiar no modo de cópia (Ctrl+a [): v seleciona, y copia
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"

# ============================================================================
# 4. Tema: PowerKit (github.com/fabioluciano/tmux-powerkit), Catppuccin Mocha
# ============================================================================
# Só a sessão e as abas, em pílulas arredondadas como as da barra do Noctalia.
# Sem plugins: hora, CPU, RAM e rede estão no Noctalia.
# Tema próprio (wiki: DevelopingThemes.md / @powerkit_custom_theme_path): o
# Catppuccin Mocha do PowerKit com a barra na cor do fundo do terminal, para as
# pílulas ficarem "soltas" e arredondadas dos dois lados. Detalhes no arquivo.
set -g @powerkit_theme "custom"
set -g @powerkit_custom_theme_path "~/.config/tmux/powerkit-catppuccin-mocha.sh"
set -g @powerkit_plugins ""                           # nenhum plugin
# Layout padrão ("session,plugins"): sessão e abas à esquerda. Os layouts de
# 3 elementos (abas à direita ou no centro) trocam a barra por um formato sem o
# status-right, e aí o continuum para de salvar as sessões sozinho.
# (@powerkit_status_justify está na documentação, mas a 7.7.0 não lê essa opção.)
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_edge_separator_style "rounded:all"   # pontas arredondadas em todas as bordas
set -g @powerkit_elements_spacing "both"              # espaço entre a sessão e as abas
# Layout simétrico: sessão e abas são pílulas iguais (ícone + texto), com o
# mesmo espaço dentro e entre elas. Opções da wiki (Configuration.md, Window Options):
# - índice separado escondido: cada aba vira uma pílula só ("os separadores se
#   ajustam à cor do conteúdo"); o número vai para dentro do título (#I)
# - sem @powerkit_transparent: na 7.7.0 as pontas e os encaixes continuam
#   pintados na cor da barra mesmo com transparência (sobra um quadrado/meio-círculo
#   escuro). Com a barra da cor do terminal (tema acima), eles somem no fundo.
set -g @powerkit_active_window_show_index "false"
set -g @powerkit_inactive_window_show_index "false"
set -g @powerkit_active_window_title "#I #W"
set -g @powerkit_inactive_window_title "#I #W"

# Ícone do modo de cópia (Ctrl+a [): na 7.7.0, sem esta opção aparece o
# texto "session-copy-bg" (bug: o padrão aponta para a cor, não para o ícone)
set -g @powerkit_session_copy_icon "\uf0c5"

# Atalhos do PowerKit, todos com Ctrl segurado depois do prefixo.
# C-e e C-y são os padrões da documentação; o seletor de temas sai do C-r
# (padrão) porque o resurrect usa Ctrl+a Ctrl+r para restaurar sessões.
set -g @powerkit_show_options_key "C-e"               # Ctrl+a Ctrl+e: todas as opções
set -g @powerkit_show_keybindings_key "C-y"           # Ctrl+a Ctrl+y: atalhos
set -g @powerkit_theme_selector_key "C-t"             # Ctrl+a Ctrl+t: testar temas
set -g @powerkit_cache_clear_key "C-x"                # Ctrl+a Ctrl+x: limpar cache
set -g @powerkit_reload_config_key ""                 # Ctrl+a r já recarrega (seção 3)
set -g @powerkit_keybinding_conflict_action "skip"    # nunca sobrescreve um atalho existente

# ============================================================================
# 5. Plugins (TPM). Ctrl+a I instala, Ctrl+a U atualiza.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-powerkit'
# resurrect: salva/restaura sessões (Ctrl+a Ctrl+s / Ctrl+a Ctrl+r)
# continuum: salva a cada 15 min (pelo status-right) e restaura ao iniciar o tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'                            # restaura as sessões ao iniciar o tmux

# Sempre a última linha
run '~/.tmux/plugins/tpm/tpm'
