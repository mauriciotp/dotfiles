# --- Terminal e cores ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on

# Teclas estendidas (CSI u): repassa combinações como Shift+Enter e Ctrl+Shift+letra
# aos programas (Claude Code, Neovim). O Ghostty já manda nesse formato.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Deixa programas falarem direto com o Ghostty (imagens no yazi, notificações, títulos)
set -g allow-passthrough on

# --- Prefixo: Ctrl+a ---
unbind C-b
set -g prefix C-a
bind a send-prefix            # Ctrl+a a: manda Ctrl+a ao programa
bind C-a last-window          # Ctrl+a Ctrl+a: última janela

# --- Numeração a partir de 1 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Divisões e janelas na pasta atual ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Redimensionar (Ctrl+a e H/J/K/L; segure para repetir) ---
# Ctrl+a l continua sendo o padrão do tmux: última janela
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Limpar a tela (Ctrl+l virou navegação) ---
bind C-l send-keys 'C-l'

# --- Popups ---
# Ctrl+a g: lazygit flutuando, na pasta do pane atual (fecha ao sair do lazygit)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Ctrl+a ?: lista de atalhos com busca (substitui a lista padrão do tmux)
bind ? display-popup -E -w 80% -h 80% "tmux list-keys | fzf --no-sort --prompt='atalhos > '"

# --- Recarregar ---
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"

# --- Modo de cópia estilo Vim, copiando para o Wayland ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# --- Tema: Catppuccin Mocha no estilo do "89iuv" ---
# A configuração mais votada da vitrine oficial do catppuccin/tmux
# (github.com/catppuccin/tmux/discussions/317), inspirada no tokyo-night-tmux.
# Adaptada: mocha em vez de macchiato; sem bateria e sem status de rede (desktop).
# O próprio TPM carrega o tema (está na lista de plugins). Por isso os estilos
# ficam DEPOIS da linha do TPM: senão o tema, carregado por último, os apaga.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"   # as abas são desenhadas abaixo, sem o estilo do tema
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Direita: data e hora. Fica antes do TPM porque o continuum se pendura no
# status-right ao carregar (é assim que ele salva as sessões sozinho).
set -g status-right-length 100
set -g status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %d/%m 󰅐 %H:%M "

# --- TPM: carrega os plugins (inclusive o tema) ---
run '~/.tmux/plugins/tpm/tpm'

# --- Estilos do tema (depois do TPM, ver acima) ---
# Barra no topo, abas centralizadas
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"
set -g status-interval 5

# Esquerda: sessão (vermelha com o prefixo ativo) │ programa │ pasta │ zoom (só quando ativo)
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$HOME|~|:#{pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Bordas dos panes: linha fina, a ativa um pouco mais clara
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# Abas: só o número; o nome aparece se você renomear a janela (Ctrl+a ,)
set -wg automatic-rename on
set -g automatic-rename-format "Window"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
