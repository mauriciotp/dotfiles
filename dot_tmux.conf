# ~/.tmux.conf
# Ordem: 1) terminal  2) comportamento  3) atalhos  4) tema (PowerKit)  5) plugins
# Recarregar: Ctrl+a r

# ============================================================================
# 1. Terminal
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"      # cores de 24 bits no Ghostty
set -g focus-events on                              # Neovim sabe quando o pane ganha foco
set -sg escape-time 10                              # Esc responde rápido no Neovim

# Teclas estendidas (CSI u): Shift+Enter, Ctrl+Shift+letra etc. chegam aos
# programas (Claude Code, Neovim) em vez de virarem Enter/letra comuns
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Programas falam direto com o Ghostty (imagens do yazi, notificações do Claude Code)
set -g allow-passthrough on

# ============================================================================
# 2. Comportamento
# ============================================================================
set -g history-limit 50000
set -g mouse on

# Janelas e panes numerados a partir de 1 (casa com a fileira de números do teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                          # fechar a 2 faz a 3 virar 2

# Nome da janela: no shell mostra a pasta; rodando algo, o programa (nvim, k9s...)
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Modo de cópia com teclas do Vim, copiando para a área de transferência do Wayland
setw -g mode-keys vi

# ============================================================================
# 3. Atalhos (prefixo Ctrl+a)
# ============================================================================
unbind C-b
set -g prefix C-a
bind a send-prefix                                  # Ctrl+a a: manda Ctrl+a ao programa
bind C-a last-window                                # Ctrl+a Ctrl+a: última janela

# Divisões e janelas novas abrem na pasta atual
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Redimensionar com H/J/K/L (segure para repetir). Navegar entre panes é
# Ctrl+h/j/k/l, sem prefixo, pelo vim-tmux-navigator (funciona dentro do Neovim)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+l virou navegação; Ctrl+a Ctrl+l limpa a tela
bind C-l send-keys 'C-l'

# Popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit   # Ctrl+a g: lazygit
bind ? display-popup -E -w 80% -h 80% "tmux list-keys | fzf --no-sort --prompt='atalhos > '"  # Ctrl+a ?: atalhos

# Copiar no modo de cópia (Ctrl+a [): v seleciona, y copia
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"

# ============================================================================
# 4. Tema: PowerKit (github.com/fabioluciano/tmux-powerkit), Catppuccin Mocha
# ============================================================================
# Minimalista: sessão e abas à esquerda, poucos plugins à direita.
# Os plugins de git e kubernetes são condicionais: só aparecem dentro de um repo
# git / com um cluster acessível. CPU, RAM e rede ficam na barra do Noctalia.
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"
set -g @powerkit_plugins "git,kubernetes"
set -g @powerkit_status_position "top"
# Sessão e abas à esquerda, plugins à direita. O layout centralizado
# ("session,windows,plugins") reescreve o status-format sem o status-right,
# e aí o continuum para de salvar as sessões sozinho, sem nenhum aviso.
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_edge_separator_style "rounded"
set -g @powerkit_elements_spacing "true"
set -g @powerkit_transparent "true"                       # fundo da barra = fundo do terminal
set -g @powerkit_plugin_git_branch_max_length "20"
# Contorno de bug do PowerKit 7.7.0 (src/renderer/entities/session.sh:50): sem esta
# opção, o modo de cópia mostra o texto "session-copy-bg" no lugar do ícone
set -g @powerkit_session_copy_icon "\uf0c5"
# Atalhos do PowerKit: Ctrl+a Ctrl+e (opções), Ctrl+a Ctrl+y (atalhos),
# Ctrl+a Ctrl+r (trocar tema), Ctrl+a Ctrl+d (limpar cache)

# ============================================================================
# 5. Plugins (TPM). Ctrl+a I instala, Ctrl+a U atualiza.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-powerkit'
# resurrect/continuum por último: o continuum se pendura no status-right
# (montado pelo PowerKit) para salvar as sessões a cada 15 min
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'                            # restaura as sessões ao iniciar o tmux

# Sempre a última linha
run '~/.tmux/plugins/tpm/tpm'

# Depois do TPM: fecha a pílula da sessão e dá um espaço antes das abas.
# Com fundo transparente, o PowerKit 7.7.0 não desenha esse fechamento e a
# sessão fica colada na primeira aba (src/renderer/compositor.sh, ~linha 858).
# A cor acompanha a da sessão: laranja no prefixo, azul no modo de cópia, mauve no normal.
set -ag status-left "#[fg=#{?client_prefix,#fab387,#{?pane_in_mode,#74c7ec,#cba6f7}},bg=default]\ue0b4 "
# E o início de cada aba (outro bug na mesma combinação; detalhes no script)
run-shell '~/.config/tmux/powerkit-ajustes.sh'
