# --- Terminal e cores ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on

# --- Prefixo: Ctrl+a ---
unbind C-b
set -g prefix C-a
bind a send-prefix            # Ctrl+a a: manda Ctrl+a ao programa
bind C-a last-window          # Ctrl+a Ctrl+a: última janela

# --- Numeração a partir de 1 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Divisões e janelas na pasta atual ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Redimensionar (Ctrl+a e H/J/K/L; segure para repetir) ---
# Ctrl+a l continua sendo o padrão do tmux: última janela
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Limpar a tela (Ctrl+l virou navegação) ---
bind C-l send-keys 'C-l'

# --- Recarregar ---
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"

# --- Modo de cópia estilo Vim, copiando para o Wayland ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# --- Tema Catppuccin: carregar antes de montar a barra ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-position top
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# --- TPM: sempre a última linha ---
run '~/.tmux/plugins/tpm/tpm'
