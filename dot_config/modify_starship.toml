{{- /* chezmoi:modify-template */ -}}
{{- /* Mantém a paleta que o Noctalia escreveu; sem ela, a Catppuccin Mocha. */ -}}
{{- $palette := regexFind "(?s)# >>> NOCTALIA STARSHIP PALETTE >>>\n.*# <<< NOCTALIA STARSHIP PALETTE <<<\n" .chezmoi.stdin -}}
{{- if not $palette -}}{{- $palette = includeTemplate "starship-palette.toml" . -}}{{- end -}}
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"
# Prompt no estilo padrão do Starship (o do README): cada parte com a palavra de
# ligação (on, via, is, took, in), em negrito, e o status do git entre colchetes.
# Ícones do preset "nerd-font-symbols". Linha 1: usuário (só root/ssh), pasta, git,
# versão do projeto e linguagem (só dentro de projetos), k8s/docker (só onde fazem
# sentido), sudo e duração do último comando. Linha 2: programas parados e a seta.
# Ícones precisam de Nerd Font (o Ghostty usa JetBrainsMono Nerd Font). Ficam como
# escapes \uXXXX porque são caracteres de uso privado que alguns editores apagam.
# Cores: paleta "noctalia", gravada no fim do arquivo pelo template do Noctalia
# (mesmos nomes da Catppuccin). O chezmoi mantém a paleta que estiver no arquivo;
# sem ela (instalação nova), usa a Catppuccin Mocha de .chezmoitemplates.
# Só o que muda o padrão (starship print-config --default).

format = """
$username\
$directory\
$git_branch$git_commit$git_state$git_status$git_metrics\
$package\
$nodejs$golang$python$rust\
$docker_context$kubernetes\
$sudo\
$cmd_duration
$jobs$character"""

# --- Usuário: só aparece como root ou por ssh ("root in pasta") ---

# --- Pasta ---
[directory]
style = "bold sky"
truncation_length = 4       # mostra no máximo as 4 últimas pastas
read_only = " \U000f033e"            # cadeado quando a pasta não é gravável
repo_root_style = "bold blue"   # a pasta raiz do repositório git em destaque (Caelestia, S3)

# --- Programas parados (Ctrl+Z), na linha da seta ---
# O jobs já vem ligado; faltava no format (S1). Símbolo a partir de 1, número a partir de 2.

# --- sudo liberado (os minutos depois de digitar a senha): "as <chapéu>" ---
[sudo]
disabled = false
symbol = " "              # chapéu de mago (preset nerd-font-symbols) (S2)
style = "bold red"

# --- Git: "on <branch> [status] +12 -3" ---
[git_branch]
symbol = " "
style = "bold pink"

[git_commit]                 # só fora de um branch (detached HEAD): o hash e, se houver, a tag
tag_disabled = false         # a tag vem desligada por padrão
tag_symbol = "  "      # preset nerd-font-symbols

# git_state aparece só no meio de rebase/merge/cherry-pick (padrão)

# status entre colchetes, como no padrão: ? novo, ! alterado, + no stage, ⇡⇣ commits
# para enviar/receber (aqui com a contagem)
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# Linhas adicionadas e removidas desde o último commit; só aparece com mudanças.
# Roda um git diff a cada prompt: se ficar lento num repositório grande, volte
# para disabled = true (Caelestia, S4)
[git_metrics]
disabled = false

# --- Versão do projeto ("is <versão>", de package.json, Cargo.toml...) ---
[package]
symbol = "\U000f03d7 "      # preset nerd-font-symbols
style = "bold peach"

# --- Linguagens ("via <ícone> <versão>"): só em pastas com arquivos delas ---
# (package.json, go.mod, pyproject.toml, Cargo.toml...)
[nodejs]
symbol = " "

[golang]
symbol = " "
style = "bold sapphire"

[python]
symbol = " "

[rust]
symbol = "\U000f1617 "

# --- Containers ---
# docker_context só aparece com Dockerfile/compose na pasta e contexto diferente de "default"
[docker_context]
symbol = " "

# k8s só em pastas de manifestos, para não poluir o prompt em todo lugar
[kubernetes]
disabled = false
symbol = "\U000f10fe "
style = "bold teal"
format = 'via [$symbol$context( \($namespace\))]($style) '
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml", "Tiltfile", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts"]

# --- Tempo do último comando: "took 3s" (padrão: só se passou de 2 s) ---

{{ $palette }}