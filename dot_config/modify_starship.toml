{{- /* chezmoi:modify-template */ -}}
{{- /* Mantém a paleta que o Noctalia escreveu; sem ela, a Catppuccin Mocha. */ -}}
{{- $palette := regexFind "(?s)# >>> NOCTALIA STARSHIP PALETTE >>>\n.*# <<< NOCTALIA STARSHIP PALETTE <<<\n" .chezmoi.stdin -}}
{{- if not $palette -}}{{- $palette = includeTemplate "starship-palette.toml" . -}}{{- end -}}
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"
# Prompt minimalista em 2 linhas, inspirado nos presets "pure" e "nerd-font-symbols".
# Linha 1: pasta, git, linguagem (só dentro de projetos), k8s/docker (só onde fazem
# sentido) e duração do último comando. Linha 2: só a seta.
# Ícones precisam de Nerd Font (o Ghostty usa JetBrainsMono Nerd Font). Ficam como
# escapes \uXXXX porque são caracteres de uso privado que alguns editores apagam.
# Cores: paleta "noctalia", gravada no fim do arquivo pelo template do Noctalia
# (mesmos nomes da Catppuccin). O chezmoi mantém a paleta que estiver no arquivo;
# sem ela (instalação nova), usa a Catppuccin Mocha de .chezmoitemplates.
# Só o que muda o padrão (starship print-config --default).

format = """
$directory\
$git_branch$git_commit$git_state$git_status$git_metrics\
$nodejs$golang$python$rust\
$docker_context$kubernetes\
$jobs$sudo\
$cmd_duration
$character"""

# --- Pasta ---
[directory]
style = "bold lavender"
truncation_length = 4       # mostra no máximo as 4 últimas pastas
read_only = " \U000f033e"            # cadeado quando a pasta não é gravável
repo_root_style = "bold blue"   # a pasta raiz do repositório git em destaque (Caelestia, S3)

# --- Programas parados (Ctrl+Z) ---
# O jobs já vem ligado; faltava no format (S1). Símbolo a partir de 1, número a partir de 2.

# --- sudo liberado (os minutos depois de digitar a senha) ---
[sudo]
disabled = false
symbol = "\uef01 "              # chapéu de mago (preset nerd-font-symbols): o próximo sudo não pede senha (S2)
format = "[$symbol]($style)"
style = "bold red"

# --- Git ---
[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]                 # só fora de um branch (detached HEAD): o hash e, se houver, a tag
tag_disabled = false         # a tag vem desligada por padrão
tag_symbol = " \uf412 "      # preset nerd-font-symbols

[git_state]                  # aparece só no meio de rebase/merge/cherry-pick
style = "yellow"

[git_status]
style = "red"
# estilo do preset pure: * = algo mudou (vermelho); ⇡⇣ = commits para enviar/receber,
# separados e em pêssego, para não grudar no *
format = "([$all_status]($style) )([$ahead_behind](peach) )"
modified = "*"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# Linhas adicionadas e removidas desde o último commit (+12 -3); só aparece com
# mudanças. Roda um git diff a cada prompt: se ficar lento num repositório
# grande, volte para disabled = true (Caelestia, S4). Depois de um │ apagado, para
# não se misturar com o status: main * ⇡3 │ +7 -1
[git_metrics]
disabled = false
format = "([│ ](overlay1)([+$added]($added_style) )([-$deleted]($deleted_style) ))"

# --- Linguagens: cada uma só aparece em pastas com arquivos dela ---
# (package.json, go.mod, pyproject.toml, Cargo.toml...)
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$pyenv_prefix($version)( \($virtualenv\))]($style) '

[rust]
symbol = "\U000f1617 "
style = "peach"
format = "[$symbol($version)]($style) "

# --- Containers ---
# docker_context só aparece com Dockerfile/compose na pasta e contexto diferente de "default"
[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# k8s só em pastas de manifestos, para não poluir o prompt em todo lugar
[kubernetes]
disabled = false
symbol = "\U000f10fe "
style = "teal"
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml", "Tiltfile", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts"]

# --- Tempo do último comando (padrão: só se passou de 2 s) ---
[cmd_duration]
style = "yellow"
format = "[\U000f199f $duration]($style)"

{{ $palette }}