# O que você muda pela janela de configurações (SUPER+vírgula) fica em
# ~/.local/state/noctalia/settings.toml e tem prioridade sobre este arquivo.

[shell]
polkit_agent      = true    # janelinha de senha quando um app pede permissão de administrador
clipboard_enabled = true    # histórico da área de transferência (SUPER+V)
# apps abertos pelo launcher/dock viram unidades do systemd (sobrevivem a um
# reinício do Noctalia). Só funciona porque o Noctalia sobe pelo uwsm (autostart.lua)
launch_apps_as_systemd_services = true

[bar.default]
position  = "top"
thickness = 34
start     = ["launcher", "wallpaper", "workspaces"]
center    = ["clock"]
end       = ["sysmon", "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "control-center", "session"]

# A barra aparece em todas as telas, inclusive na TV

# Indicador de workspaces: mostra o nome, que o workspaces.lua do Hyprland põe
# igual ao número da tecla (o 13 do segundo monitor aparece como 3)
[widget.workspaces]
label_source = "name"

[theme]
builtin = "Catppuccin"
mode = "dark"
    [theme.templates]
    builtin_ids = ["gtk3", "gtk4", "ghostty", "hyprland"]
    # comunitários: ligar aqui, não pela interface (ela grava no settings.toml, fora do chezmoi)
    enable_community_templates = true
    community_ids = ["obsidian", "heroiclauncher", "obs", "fzf", "bat", "starship", "lazyvim", "yazi", "lazygit"]

[notification]
position = "top_right"

# Inatividade (substitui o hypridle): bloqueia aos 10 min e apaga as telas aos 11
[idle.behavior.lock]
timeout = 600
action  = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action  = "screen_off"
enabled = true

# Nunca suspende sozinho
[idle.behavior.suspend]
timeout = 900
action  = "lock_and_suspend"
enabled = false
