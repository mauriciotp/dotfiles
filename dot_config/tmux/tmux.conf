# tmux: só o que muda o padrão do 3.8 (tmux -f /dev/null start \; show -g)
# Ordem: 1) terminal  2) comportamento  3) atalhos  4) barra  5) plugins
# Recarregar: Ctrl+Space r

# ============================================================================
# 1. Terminal
# ============================================================================
set -as terminal-features ",xterm-ghostty:RGB"      # cores de 24 bits no Ghostty
set -g focus-events on                              # Neovim sabe quando o pane ganha foco

# Teclas estendidas (CSI u): Shift+Enter, Ctrl+Shift+letra etc. chegam aos
# programas (Claude Code, Neovim) em vez de virarem Enter/letra comuns
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Programas falam direto com o Ghostty (imagens do yazi, notificações do Claude Code)
set -g allow-passthrough on
# o yazi descobre o protocolo de imagem pelo terminal de fora (doc do yazi, Image Preview)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Programas dentro do tmux (Neovim, SSH) copiam para a área de transferência
# por OSC 52; o Ghostty aceita (tmux display -p '#{client_termfeatures}')
set -g set-clipboard on
# Título da janela do Ghostty (e do ALT+Tab do Hyprland): "sessão: janela"
set -g set-titles on
set -g set-titles-string "#S: #W"

# ============================================================================
# 2. Comportamento
# ============================================================================
set -g history-limit 50000

# Janelas e panes numerados a partir de 1 (casa com a fileira de números do teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                          # fechar a 2 faz a 3 virar 2

# Nome da janela: no shell mostra a pasta; rodando algo, o programa (nvim, k9s...)
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Modo de cópia com teclas do Vim. Escrito mesmo sendo o padrão aqui: o padrão
# só é vi quando EDITOR/VISUAL contém "vi" (man tmux)
setw -g mode-keys vi

# Fechar uma sessão leva para outra, em vez de sair do tmux (Omarchy)
set -g detach-on-destroy off

# ============================================================================
# 3. Atalhos (prefixo Ctrl+Space, como no Omarchy)
# ============================================================================
# Ctrl+Space e não Ctrl+a: o Ctrl+a fica para o zsh (início da linha) e o
# Neovim (soma 1). No Neovim o Ctrl+Space (menu do blink.cmp, seleção do flash)
# vai com Ctrl+Space Ctrl+Space. Sem o prefix2 C-b do Omarchy: o Neovim usa o
# Ctrl+b. Última janela: Ctrl+Space l (padrão do tmux).
unbind C-b
set -g prefix C-Space
bind -N "Send Ctrl+Space to the program" C-Space send-prefix

# Divisões e janelas novas abrem na pasta atual
unbind '"'
unbind %
bind -N "Split: pane to the right" | split-window -h -c "#{pane_current_path}"
bind -N "Split: pane below" - split-window -v -c "#{pane_current_path}"
bind -N "New window in the current folder" c new-window -c "#{pane_current_path}"

# Redimensionar com H/J/K/L (segure para repetir). Navegar entre panes é
# Ctrl+h/j/k/l, sem prefixo, pelo vim-tmux-navigator (funciona dentro do Neovim)
bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane down" -r J resize-pane -D 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

# Ctrl+l virou navegação; Ctrl+Space Ctrl+l limpa a tela
bind -N "Clear the screen" C-l send-keys 'C-l'

# Sem prefixo (Omarchy): Alt+número vai para a janela, Alt+↑/↓ troca de sessão.
# O Ghostty não usa mais o Alt+número para abas.
bind -N "Window 1" -n M-1 select-window -t 1
bind -N "Window 2" -n M-2 select-window -t 2
bind -N "Window 3" -n M-3 select-window -t 3
bind -N "Window 4" -n M-4 select-window -t 4
bind -N "Window 5" -n M-5 select-window -t 5
bind -N "Window 6" -n M-6 select-window -t 6
bind -N "Window 7" -n M-7 select-window -t 7
bind -N "Window 8" -n M-8 select-window -t 8
bind -N "Window 9" -n M-9 select-window -t 9
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n
bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1
# Panes sem prefixo (Omarchy). Alt+Esc fecha sem perguntar
bind -N "Split: pane below" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split: pane to the right" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

# Panes e janelas entre si (config da comunidade): V/S trazem um pane de outra
# janela, escolhido na árvore (V ao lado, S embaixo); b leva o pane para uma
# janela própria (o padrão é !)
bind -N "Join a pane here: to the right (pick in tree)" V choose-tree -Z 'join-pane -h -s "%%"'
bind -N "Join a pane here: below (pick in tree)" S choose-tree -Z 'join-pane -v -s "%%"'
bind -N "Break pane into its own window" b if-shell -F "#{>:#{window_panes},1}" "break-pane -a"

# Fechar sem confirmar (Omarchy): x pane, k janela. A sessão vai no X, porque
# o K redimensiona
bind -N "Kill pane" x kill-pane
bind -N "Kill window" k kill-window
bind -N "Kill session" X kill-session
bind -N "Rename session" R command-prompt -I "#S" { rename-session -- "%%" }

# Rolar: entra no modo de cópia já meia página acima/abaixo
bind -N "Scroll half page up" C-u copy-mode -u
bind -N "Scroll half page down" C-d copy-mode -d

# Popups
bind -N "Sessionizer: zoxide folders" f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"
bind -N "lazygit (popup)" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Ctrl+Space ?: atalhos com descrição (bind -N), com busca. Para ver tudo, até os
# sem descrição, como os de plugins: tmux list-keys
bind -N "Keybindings (search)" ? display-popup -E -w 70% -h 80% -T " tmux keybindings " "tmux list-keys -N | fzf --no-sort --layout=reverse --prompt='search > '"

# Copiar no modo de cópia (Ctrl+Space [): v seleciona, y copia
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ============================================================================
# 4. Barra: catppuccin Mocha, estilo "hyprland/polybar" (discussão do tema, inbox)
# ============================================================================
# O tema só dá as cores (@thm_*) e os estilos de mensagens, menus e bordas; a
# barra é montada aqui. Ordem da doc do tema para quem usa TPM: carregar o tema
# com run, depois a barra, e o TPM por último.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"         # barra transparente
set -g @catppuccin_window_status_style "none"       # janelas formatadas abaixo
# bordas pelas opções do tema: o TPM roda o tema de novo no fim e sobrescreveria
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_overlay_0}"
# Instalação nova: o tema só existe depois do Ctrl+Space I
if-shell "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g status-position top
set -g status-justify absolute-centre              # janelas no meio

# Esquerda: sessão (vermelha com o prefixo) │ programa │ pasta │ zoom, se houver
set -g status-left-length 100
set -g status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=default,fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[fg=#{@thm_overlay_0}]│"
set -ga status-left "#[fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[fg=#{@thm_overlay_0}]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Direita: só o modo de cópia, quando ativo (relógio e rede ficam na Noctalia)
set -g status-right-length 20
set -g status-right "#[fg=#{@thm_peach}]#{?pane_in_mode,  copy ,}"

# Janelas: número e nome (o do automatic-rename). Rosewater; a última em
# peach; a atual com fundo peach; sino e atividade em vermelho
set -g window-status-format " #I: #W "
set -g window-status-current-format " #I: #W "
set -gF window-status-style "bg=default,fg=#{@thm_rosewater}"
set -gF window-status-last-style "bg=default,fg=#{@thm_peach}"
set -gF window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -gF window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -gF window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[fg=#{@thm_overlay_0}]│"

# ============================================================================
# 5. Plugins (TPM, em ~/.config/tmux/plugins). Ctrl+Space I instala, Ctrl+Space U atualiza.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# o catppuccin fica em plugins/tmux (nome do repositório); fixado na versão da doc do inbox
set -g @plugin 'catppuccin/tmux#v2.3.2'
# resurrect: salva/restaura sessões (Ctrl+Space Ctrl+s / Ctrl+Space Ctrl+r)
# continuum: salva a cada 15 min (por um gancho no status-right, por isso vem
# depois da barra e por último na lista) e restaura ao iniciar o tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Sempre a última linha
run '~/.config/tmux/plugins/tpm/tpm'
