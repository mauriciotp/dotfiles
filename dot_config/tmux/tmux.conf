# tmux: só o que muda o padrão do 3.8 (tmux -f /dev/null start \; show -g)
# Ordem: 1) terminal  2) comportamento  3) atalhos  4) barra  5) plugins
# Recarregar: Ctrl+a r

# ============================================================================
# 1. Terminal
# ============================================================================
set -as terminal-features ",xterm-ghostty:RGB"      # cores de 24 bits no Ghostty
set -g focus-events on                              # Neovim sabe quando o pane ganha foco

# Teclas estendidas (CSI u): Shift+Enter, Ctrl+Shift+letra etc. chegam aos
# programas (Claude Code, Neovim) em vez de virarem Enter/letra comuns
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Programas falam direto com o Ghostty (imagens do yazi, notificações do Claude Code)
set -g allow-passthrough on
# o yazi descobre o protocolo de imagem pelo terminal de fora (doc do yazi, Image Preview)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ============================================================================
# 2. Comportamento
# ============================================================================
set -g history-limit 50000

# Janelas e panes numerados a partir de 1 (casa com a fileira de números do teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                          # fechar a 2 faz a 3 virar 2

# Nome da janela: no shell mostra a pasta; rodando algo, o programa (nvim, k9s...)
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Modo de cópia com teclas do Vim. Escrito mesmo sendo o padrão aqui: o padrão
# só é vi quando EDITOR/VISUAL contém "vi" (man tmux)
setw -g mode-keys vi

# Fechar uma sessão leva para outra, em vez de sair do tmux (Omarchy)
set -g detach-on-destroy off

# ============================================================================
# 3. Atalhos (prefixo Ctrl+a)
# ============================================================================
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl+a to the program" a send-prefix
bind -N "Last window" C-a last-window

# Divisões e janelas novas abrem na pasta atual
unbind '"'
unbind %
bind -N "Split: pane to the right" | split-window -h -c "#{pane_current_path}"
bind -N "Split: pane below" - split-window -v -c "#{pane_current_path}"
bind -N "New window in the current folder" c new-window -c "#{pane_current_path}"

# Redimensionar com H/J/K/L (segure para repetir). Navegar entre panes é
# Ctrl+h/j/k/l, sem prefixo, pelo vim-tmux-navigator (funciona dentro do Neovim)
bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane down" -r J resize-pane -D 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

# Ctrl+l virou navegação; Ctrl+a Ctrl+l limpa a tela
bind -N "Clear the screen" C-l send-keys 'C-l'

# Sem prefixo (Omarchy): Alt+número vai para a janela, Alt+↑/↓ troca de sessão.
# O Ghostty não usa mais o Alt+número para abas.
bind -N "Window 1" -n M-1 select-window -t 1
bind -N "Window 2" -n M-2 select-window -t 2
bind -N "Window 3" -n M-3 select-window -t 3
bind -N "Window 4" -n M-4 select-window -t 4
bind -N "Window 5" -n M-5 select-window -t 5
bind -N "Window 6" -n M-6 select-window -t 6
bind -N "Window 7" -n M-7 select-window -t 7
bind -N "Window 8" -n M-8 select-window -t 8
bind -N "Window 9" -n M-9 select-window -t 9
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Popups
bind -N "Sessionizer: zoxide folders" f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"
bind -N "lazygit (popup)" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Ctrl+a ?: atalhos com descrição (bind -N), com busca. Para ver tudo, até os
# sem descrição, como os de plugins: tmux list-keys
bind -N "Keybindings (search)" ? display-popup -E -w 70% -h 80% -T " tmux keybindings " "tmux list-keys -N | fzf --no-sort --layout=reverse --prompt='search > '"

# Copiar no modo de cópia (Ctrl+a [): v seleciona, y copia
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ============================================================================
# 4. Barra (como a do Omarchy), em cima
# ============================================================================
# Cores do terminal (blue, black...): seguem o Ghostty, que segue o Noctalia.
# À esquerda a sessão; as janelas como número:nome; à direita os modos ativos.
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-left-length 30                        # nomes de projeto do sessionizer
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}"
set -g window-status-separator ""
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# ============================================================================
# 5. Plugins (TPM, em ~/.config/tmux/plugins). Ctrl+a I instala, Ctrl+a U atualiza.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# resurrect: salva/restaura sessões (Ctrl+a Ctrl+s / Ctrl+a Ctrl+r)
# continuum: salva a cada 15 min (por um gancho no status-right, por isso vem
# depois da barra e por último na lista) e restaura ao iniciar o tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Sempre a última linha
run '~/.config/tmux/plugins/tpm/tpm'
