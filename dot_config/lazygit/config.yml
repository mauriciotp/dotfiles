# Só o que muda o padrão (Configuração padrão do lazygit 0.66).
# O bloco gui.theme é escrito pelo template "lazygit" do Noctalia;
# depois de trocar o tema: chezmoi re-add este arquivo.
gui:
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#fab387"
    searchingActiveBorderColor:
      - "#94e2d5"
      - bold
    optionsTextColor:
      - "#a3b4eb"
    selectedLineBgColor:
      - "#3a3b50"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#a3b4eb"
    cherryPickedCommitBgColor:
      - "#94e2d5"
    markedBaseCommitFgColor:
      - "#94e2d5"
    markedBaseCommitBgColor:
      - "#f38ba8"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  nerdFontsVersion: "3" # ícones de arquivo (o Ghostty usa JetBrainsMono Nerd Font)
