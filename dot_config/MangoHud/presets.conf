# Presets do MangoHud. No modo console (gamescope -e), a Steam não usa o
# MangoHud.conf: ela escreve só "preset=N" num arquivo próprio, conforme o
# nível do overlay de desempenho (menu de acesso rápido, botão "..."). Os
# níveis 1 a 4 são os presets 1 a 4; aqui o 4 (Detalhado) vira o mesmo
# conjunto do MangoHud.conf. Os outros níveis ficam no padrão do MangoHud.

[preset 4]
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync
