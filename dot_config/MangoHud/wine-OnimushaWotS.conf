# Só para o Onimusha: Way of the Sword (OnimushaWotS.exe).
# O MangoHud usa este arquivo NO LUGAR do MangoHud.conf para este jogo.
#
# Problema: com o HUD visível desde o início, o jogo (VKD3D/DX12 + DLSS Frame
# Generation na NVIDIA) trava na tela preta logo após criar a swapchain.
# Contorno (MangoHud issue #1551): o HUD começa escondido. Espere chegar no
# menu e mostre com Shift_R+F12.
no_display

# Sem limitador do MangoHud aqui: o jogo já limita (MaxFPS / Reflex do DLSS-FG)
fps_limit=0

position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

toggle_hud=Shift_R+F12
