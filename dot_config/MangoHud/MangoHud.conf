# Ative pela Steam com  MANGOHUD=1 %command%  (só a camada Vulkan).
# Evite o wrapper "mangohud %command%": ele injeta libMangoHud_shim.so via
# LD_PRELOAD em todo o processo. Com o wrapper, o Onimusha: Way of the Sword
# trava na tela preta. Se MANGOHUD=1 também travar, o culpado é a camada.
# A CONFIRMAR (veja a nota Jogos/Onimusha no vault).

# Limite de FPS: 3 abaixo dos 144 Hz, dentro do G-Sync. Shift_L+F1 alterna
# entre 141 e sem limite.
fps_limit=141,0
fps_limit_method=late
toggle_fps_limit=Shift_L+F1

# O que mostrar
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

# Mostrar/esconder
toggle_hud=Shift_R+F12
