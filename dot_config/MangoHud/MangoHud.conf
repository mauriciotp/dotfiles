# Ative pela Steam com  mangohud %command%  (serve para Vulkan/Proton e OpenGL).
# MANGOHUD=1 %command% liga só a camada Vulkan; em jogos Proton dá no mesmo.
# Exceções por jogo ficam em wine-<Exe>.conf (ex.: wine-OnimushaWotS.conf).

# Limite de FPS: 3 abaixo dos 144 Hz, dentro do G-Sync. Shift_L+F1 alterna
# entre 141 e sem limite.
fps_limit=141,0
fps_limit_method=late
toggle_fps_limit=Shift_L+F1

# O que mostrar
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

# Mostrar/esconder: os jogos começam com o HUD escondido (no_display), no
# desktop (game-run) e no modo console (o steam-console usa uma cópia deste
# arquivo). Shift_R+F12 mostra e esconde.
no_display
toggle_hud=Shift_R+F12
