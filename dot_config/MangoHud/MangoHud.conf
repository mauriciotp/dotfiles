# Config do MangoHud, gerada pelo GOverlay 1.9.4 e limpa do que era dele:
# sem o output_folder (a pasta do GOverlay) e sem a blacklist dele.
# Logs (Shift_L+F2): sem output_folder, o MangoHud grava no $HOME
# (src/logging.cpp, 0.8.4). Para outra pasta, crie-a antes: ele não cria.
# Só roda quando pedido (mangohud gamemoderun %command%), então começa visível;
# Shift_R+F12 (toggle_hud) esconde e mostra. Sem limitador de FPS: o limite
# não pode depender do HUD (README, "Ver as métricas de um jogo e limitar o FPS").
legacy_layout=0

background_alpha=0.6
round_corners=10
background_color=000000
font_size=24
text_color=FFFFFF
position=top-left
toggle_hud=Shift_R+F12
gpu_list=0
table_columns=3
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=FFFFFF,FFFFFF,FFFFFF
vram
vram_color=AD64C1
gpu_core_clock
gpu_mem_clock
gpu_temp
gpu_power
gpu_color=2E9762
cpu_stats
cpu_load_change
cpu_load_value=50,90
cpu_load_color=FFFFFF,FFFFFF,FFFFFF
cpu_mhz
cpu_temp
cpu_power
cpu_color=2E97CB
ram
ram_color=C26693
fps
fps_metrics=avg,0.01
frame_timing
frametime_color=00FF00
engine_color=EB5B5B
fps_color_change
fps_color=FF0000,FFFF00,00FF00
fps_value=30,60
log_interval=100
toggle_logging=Shift_L+F2
