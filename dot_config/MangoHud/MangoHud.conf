# Ative pela Steam com  MANGOHUD=1 %command%  (só a camada Vulkan).
# O wrapper "mangohud %command%" também injeta libMangoHud_shim.so via
# LD_PRELOAD, o que só é necessário em jogos OpenGL.
# Exceções por jogo ficam em wine-<Exe>.conf (ex.: wine-OnimushaWotS.conf).

# Limite de FPS: 3 abaixo dos 144 Hz, dentro do G-Sync. Shift_L+F1 alterna
# entre 141 e sem limite.
fps_limit=141,0
fps_limit_method=late
toggle_fps_limit=Shift_L+F1

# O que mostrar
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

# Mostrar/esconder
toggle_hud=Shift_R+F12
