# Sem limitador de FPS global: o limitador do MangoHud (fps_limit) trava na
# tela preta jogos DX12 com DLSS Frame Generation/Reflex (Streamline), como o
# Onimusha: Way of the Sword. Limite pelo jogo (Reflex + G-Sync já seguram
# abaixo dos 144 Hz) ou ligue por jogo em ~/.config/MangoHud/wine-<Exe>.conf.
# Atalho para alternar o limite em jogos que aceitam: Shift_L+F1.
fps_limit=0,141
toggle_fps_limit=Shift_L+F1

# O que mostrar
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

# Mostrar/esconder
toggle_hud=Shift_R+F12
