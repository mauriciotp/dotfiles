# O MangoHud só roda quando você pede, para medir o desempenho de um jogo:
#   Steam:     game-run --hud %command%  (nas opções de inicialização do jogo)
#   Lichii:    entrada "Lichii (MangoHud)" no menu, ou o emulador alternativo
#              "Lichii (Standalone, MangoHud)" do jogo no ES-DE
#   outro app: MANGOHUD=1 app (Vulkan) ou mangohud app (também OpenGL)
# Exceções por jogo ficam em wine-<Exe>.conf (ex.: wine-OnimushaWotS.conf).
#
# Sem limite de FPS aqui: o game-run limita a 141 pelo DXVK e pelo VKD3D, sem
# o MangoHud. O limitador do MangoHud já travou jogos DX12 na tela preta.

# O que mostrar
position=top-left
fps
frametime
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
winesync

# Aparece ao abrir (você pediu o HUD). Shift_R+F12 esconde e mostra.
# No modo console, o steam-console acrescenta no_display à cópia dele: lá o
# HUD só aparece com game-run --hud.
toggle_hud=Shift_R+F12
