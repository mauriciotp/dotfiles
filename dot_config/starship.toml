"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"
# Prompt minimalista em 2 linhas, inspirado nos presets "pure" e "nerd-font-symbols".
# Linha 1: pasta, git, linguagem (só dentro de projetos), k8s/docker (só onde fazem
# sentido) e duração do último comando. Linha 2: só a seta.
# Ícones precisam de Nerd Font (o Ghostty usa JetBrainsMono Nerd Font). Ficam como
# escapes \uXXXX porque são caracteres de uso privado que alguns editores apagam.
# Cores: paleta "noctalia", gravada no fim do arquivo pelo template do Noctalia
# (mesmos nomes da Catppuccin). Depois de trocar o tema: chezmoi re-add este arquivo.
# Só o que muda o padrão (starship print-config --default).

format = """
$directory\
$git_branch$git_state$git_status\
$nodejs$golang$python$rust\
$docker_context$kubernetes\
$cmd_duration
$character"""

# --- Pasta ---
[directory]
style = "bold lavender"
truncation_length = 4       # mostra no máximo as 4 últimas pastas
read_only = " \U000f033e"            # cadeado quando a pasta não é gravável

# --- Git ---
[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_state]                  # aparece só no meio de rebase/merge/cherry-pick
style = "yellow"

[git_status]
style = "red"
# estilo do preset pure: * = algo mudou, ⇡⇣ = commits para enviar/receber
format = "([$all_status$ahead_behind]($style) )"
modified = "*"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# --- Linguagens: cada uma só aparece em pastas com arquivos dela ---
# (package.json, go.mod, pyproject.toml, Cargo.toml...)
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$pyenv_prefix($version)( \($virtualenv\))]($style) '

[rust]
symbol = "\U000f1617 "
style = "peach"
format = "[$symbol($version)]($style) "

# --- Containers ---
# docker_context só aparece com Dockerfile/compose na pasta e contexto diferente de "default"
[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# k8s só em pastas de manifestos, para não poluir o prompt em todo lugar
[kubernetes]
disabled = false
symbol = "\U000f10fe "
style = "teal"
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml", "Tiltfile", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts"]

# --- Tempo do último comando (padrão: só se passou de 2 s) ---
[cmd_duration]
style = "yellow"
format = "[\U000f199f $duration]($style)"

