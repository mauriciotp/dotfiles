"$schema" = 'https://starship.rs/config-schema.json'
# Prompt minimalista em 2 linhas, inspirado nos presets "pure" e "nerd-font-symbols".
# Linha 1: pasta, git, linguagem (só dentro de projetos), k8s/docker (só onde fazem
# sentido) e duração do último comando. Linha 2: só a seta.
# Ícones precisam de Nerd Font (o Ghostty usa JetBrainsMono Nerd Font).
palette = "catppuccin_mocha"
add_newline = true   # linha em branco entre um comando e o próximo

format = """
$directory\
$git_branch$git_state$git_status\
$nodejs$golang$python$rust\
$docker_context$kubernetes\
$cmd_duration
$character"""

# --- Pasta ---
[directory]
style = "bold lavender"
truncation_length = 4       # mostra no máximo as 4 últimas pastas
truncate_to_repo = true     # dentro de um repo git, começa na raiz do repo
read_only = " 󰌾"            # cadeado quando a pasta não é gravável
read_only_style = "red"

# --- Git ---
[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_state]                  # aparece só no meio de rebase/merge/cherry-pick
style = "yellow"

[git_status]
style = "red"
# estilo do preset pure: * = algo mudou, ⇡⇣ = commits para enviar/receber
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# --- Linguagens: cada uma só aparece em pastas com arquivos dela ---
# (package.json, go.mod, pyproject.toml, Cargo.toml...)
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$pyenv_prefix($version)( \($virtualenv\))]($style) '

[rust]
symbol = "󱘗 "
style = "peach"
format = "[$symbol($version)]($style) "

# --- Containers ---
# docker_context só aparece com Dockerfile/compose na pasta e contexto diferente de "default"
[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# k8s só em pastas de manifestos, para não poluir o prompt em todo lugar
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "teal"
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml", "Tiltfile", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts"]

# --- Tempo do último comando (só se passou de 2 s) ---
[cmd_duration]
min_time = 2000
style = "yellow"
format = "[󱦟 $duration]($style)"

# --- Seta: verde se o último comando deu certo, vermelha se falhou ---
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
